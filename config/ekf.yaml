ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    odom_frame: my_robot/odom
    base_link_frame: my_robot/chassis
    world_frame: my_robot/odom
    # wheel odometry: forward speed and yaw rate
    odom0: /wheel/odometry
    odom0_config: [false, false, false, false, false, false,
                   true,  true,  false, false, false, true,
                   false, false, false]
    # IMU: yaw and yaw rate
    imu0: /imu/data
    imu0_config: [false, false, false, false, false, true,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_relative: true
